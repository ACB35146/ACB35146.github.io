<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的主页</title>
    <style>
        /* 1. 页面渐变背景（满足作业背景要求） */
        body {
            margin: 0;
            height: 100vh;
            /* 紫粉色渐变背景，和示例风格一致 */
            background: linear-gradient(180deg, #d44aa4, #df8fc9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 外层圆角卡片 */
        .box {
            width: 400px;
            height: 320px;
            background: #78e4f5;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* 黑色播放框 */
        .play-box {
            width: 280px;
            height: 200px;
            background: #222222;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9980, #b85868);
        }

        /* 播放按钮 */
        .play-btn {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn::after {
            content: "";
            width: 0;
            height: 0;
            border-left: 35px solid #77e56f;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="play-box">
            <div class="play-btn"></div>
        </div>
    </div>
</body>
</html>
